# Configuration file

general {
    # Allow registering potions with a higher ID than normal, only use with mods that expand the ID range, such as EndlessIDs. EXPERIMENTAL [default: false]
    B:allowHigherIDSpace=false

    # Some default BlockTicking events for Reika's mods are very expensive, and are therefore optimized.
    #
    # Currently that only entrails changes to:
    # - Leaf decay of custom leafs based on DAPI
    # - Snow melting in Satisforestry's biome
    #
    # If you notice any changes, and would like to have the original behavior with the performance cost, you can disable this here.
    #  [default: true]
    B:cacheExpensiveBlockTicking=true

    # Disables the shader found near Data Towers from ChromatiCraft [default: false]
    B:disableArtefactShader=false

    # Forces DragonAPI's "client-specific" config options to use the same keys across all systems [default: false]
    B:disableClientSpecificConfigs=false

    # Disables DAPI's optional rain toggling in favor of Angelica's built in toggle. Is only active if angelica is present. [default: true]
    B:disableDAPIRainTweaks=true

    # Disables the "heat" shader in the Nether from DragonRealmCore [default: false]
    B:disableNetherShader=false

    # Disables the TerritoryZone-based Stronghold generation system from DragonRealmCore [default: true]
    B:disableTerritoryStrongholdSystem=true

    # Disables DragonRealmCore's TickIntercept ASM (pauses the server when no players are online; disabled by default in DragonRealmCore config) [default: true]
    B:disableTickInterceptASM=true

    # Disable some generic IFluidHandler tooltips on TEs from RC, ReC & CC. Intended for usage if you have a nicer provider such as WailaPlugins. [default: false]
    B:disableWailaFluidTooltips=false

    # Whether or not to enable fix of server crash when using bypass panel of shifting maze. Make sure to disable this if using MMNHUtils (or disable their check) [default: true]
    B:enableShiftMazeBypassCrashFix=true

    # Prevents crashes in `EnergizationManager#getEnergizationLevel`; breaks DragonRealmCore's "Atmospheric Permeability Mediation" mechanic [default: true]
    B:energizationManagerFix=true

    # Fixes a crash where Angelica's MCPatcher CTM module does not apply / crashes the game on startup. [default: true]
    B:fixAngelicaCTMBlocksCompat=true

    # Makes Custom Item Property of Shaders in Angelica compatible with base modifications from CC. Is only active if angelica is present. Requires Angelica 2.1.3+. [default: true]
    B:fixAngelicaShaderCIPCompat=true

    # Fixes a crash when hovering over some ChromatiCraft blocks in NEI and the tagMap AT isn't loaded. [default: false]
    B:fixNEIInvalidAccessErrorCrash=false

    # Forces ChromatiCraft to use cached EDDB trade data instead of trying to fetch it and freezing up during loading, because the site has been down since 2022. [default: true]
    B:forceUseCachedEDDBTrades=true

    # Enable heavy patches on Reikas mods to allow running inside a dev env, will break mod integration. DO NOT USE OUTSIDE OF DEV ENV. [default: false]
    B:insideDevEnv=true

    # Changes the duration (in millis) to check if we are connected to the internet at startup. DragonAPI checks 6 remote sources, so this value is multiplied by 6 internally. [range: 100 ~ 20000, default: 1000]
    I:internetConnectivityTimeoutDuration=1000

    # If you aren't happy with the worldgen in some way, and can accept it being slower, disable it here. Feel free to open an issue, if you notice any different worldgen. [default: true]
    B:optimizeWorldGen=true

    # Disable DAPI's custom BlockPlaceEvent, that is sent for every setBlock (and related), even during worldgen.
    # This event is barely used across Reika's mods, and while even those uses are not that expensive, just the sheer number of events fired during worldgen can cause significant (serverside) slowdown.
    #
    # We replace this event with more performant handling for all usages, which are very unlikely to not cause issues, but if you encounter any issues with the following features,
    # and would like to pay the performance cost of the event, you can disable is here.
    #
    # - RotaryCraft EMP effect reset on blocks
    # - RotaryCraft Hydrokinetics stream invalidation with the Streams Mod
    # - World Gen Changes:
    #     - Thaumcraft: Totem generation in Pink Birch Forest and Rainbow Forest biomes (should be disabled)
    #     - Tinkers Construct: Slime Island generation in Glowing Cliffs and Pink Birch Forest biomes (should be disabled)
    #     - Thaumcraft: Boosted / changed node generation in CC's & SF's biomes
    #     - Modified Spawners in Glowing Cliffs (wisps) and Rainbow Forest biomes (slowed)
    #     - No Chisel Generation in the Glowing Cliffs
    #     - Obsidian in the Pink Birch Forest biome above y 100 (no idea why this is a thing)
    #     - Data Nodes being damaged when generated in the Rainbow Forest
    #
    # - Crystal Network Link Obstructions
    # - Lumen Broadcaster 80% no-obstruction requirements
    #  [default: true]
    B:replaceDefaultBlockPlaceEvent=true
}


