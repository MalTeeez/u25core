// Add any additional repositories for your dependencies here.

repositories {
    exclusiveContent {
        forRepository {
            ivy {
                name = 'ChromatiFixes releases'
                url = 'https://github.com/MalTeeez/ChromatiFixes/releases/download/'
                patternLayout {
                    artifact '[revision]/[module]-[revision](-[classifier]).[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModule('MalTeeez', 'ChromatiFixes')
        }
    }
    exclusiveContent {
        forRepository {
            ivy {
                name = 'Mekanism releases'
                url = 'https://github.com/MalTeeez/Mekanism-Community-Edition/releases/download/'
                patternLayout {
                    artifact '[revision]/[module]-[revision](-[classifier]).[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModule('MalTeeez', 'mekanism')
        }
    }
}
